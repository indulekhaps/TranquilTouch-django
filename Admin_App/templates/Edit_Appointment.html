<!doctype html>
<html>
<head>
<title>Manage Appointment</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body style="background:#f3f7fb;">
<div class="container mt-5">
<div class="card p-4 shadow">

<h4 class="mb-4">Manage Appointment</h4>

<form method="post" action="{% url 'update_appointment' appointment.id %}">
{% csrf_token %}

<div class="row">
<div class="col-md-6 mb-3">
<label>Customer</label>
<input type="text" class="form-control" value="{{ appointment.Customer_name }}" disabled>
</div>

<div class="col-md-6 mb-3">
<label>Service</label>
<input type="text" class="form-control" value="{{ appointment.Service }}" disabled>
</div>

<div class="col-md-6 mb-3">
<label>Preferred Staff Level</label>
<input type="text" class="form-control" value="{{ appointment.staff_level|title }}" disabled>
</div>

<div class="col-md-6 mb-3">
<label>Assign Staff</label>
<select name="assigned_staff" class="form-control" required>
    <option value="">Select Staff</option>
    {% for s in staff_list %}
        <option value="{{ s.Staff_Name }}"
            {% if s.Staff_Name == appointment.assigned_staff %}selected{% endif %}>
            {{ s.Staff_Name }}
        </option>
    {% empty %}
        <option disabled>No staff available for this service</option>
    {% endfor %}
</select>
</div>

<div class="col-md-6 mb-3">
<label>Status</label>
<select name="status" class="form-control">
<option value="pending" {% if appointment.status == 'pending' %}selected{% endif %}>Pending</option>
<option value="confirmed" {% if appointment.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
<option value="cancelled" {% if appointment.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
<option value="completed" {% if appointment.status == 'completed' %}selected{% endif %}>Completed</option>
</select>
</div>
</div>

<div class="text-right mt-4">
<button class="btn btn-primary">Update Appointment</button>
<a href="{% url 'admin_view_appointments' %}" class="btn btn-secondary">Back</a>
</div>

</form>

</div>
</div>
</body>
</html>
